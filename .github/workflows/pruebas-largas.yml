name: Pruebas largas

# Los tests estadísticos (ia-n*, arm-6, partida-3, nav-3, nucleo-4...) corren
# en el CI de cada PR con una muestra reducida (tests/utils/muestra.ts): con la
# batería completa test:unit tardaba ~15 min por PR. Aquí corre la batería
# completa, cada noche y a mano, sobre las mismas semillas.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [chore/tests-largos-nightly]

permissions:
  contents: read

jobs:
  test-unit-completo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:unit
        env:
          PRUEBA_LARGA: "1"
