name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Disparo manual: el push de un squash-merge a dev no generó check-runs una
  # vez (commit dfc0803, ver desarrollo-26), sin causa visible en los logs de
  # la API. Con esto se puede reconfirmar CI sobre un commit concreto sin
  # tener que repetir el merge.
  workflow_dispatch:

jobs:
  # En el push del merge se salta igual que el e2e (decidir-e2e): mismo
  # árbol que la cabeza del PR, que ya pasó lint, tipos, build y tests en
  # verde. Eran ~7 min por bloque repitiendo lo mismo.
  lint-typecheck-build:
    runs-on: ubuntu-latest
    needs: decidir-e2e
    if: needs.decidir-e2e.outputs.ejecutar == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # andamiaje-2: el presupuesto de JS se comprueba en cada build, no una
      # vez -- este job corre en cada push y en cada PR.
      - run: npm run verificar:presupuesto-bundle
      # terreno-1, terreno-2, terreno-4, terreno-5: tests deterministas del
      # núcleo de simulación, sin navegador.
      - run: npm run test:unit
      # terreno-6: comprobación mecánica de que getImageData/putImageData no
      # aparecen fuera de la lista blanca declarada.
      - run: node scripts/comprobar-sin-lectura-canvas.mjs
      # nucleo-3: src/sim no puede importar phaser/react/next ni referenciar
      # globals de navegador -- el test de Node no probaría nada si pudiera.
      - run: node scripts/comprobar-frontera-nucleo.mjs
      # nucleo-4: Math.random rompería el determinismo del que dependen las
      # repeticiones, el guardado/reanudado y el multijugador por entradas.
      - run: node scripts/comprobar-sin-math-random.mjs
      # ia-4: src/sim/ia solo propone una EntradaDeTurno, nunca resuelve el
      # disparo ni toca la máscara directamente.
      - run: node scripts/comprobar-frontera-ia.mjs
      # nav-4: la gravedad de N cuerpos tira de los proyectiles en vuelo,
      # nunca de las naves -- ver el guion para el porqué.
      - run: node scripts/comprobar-gravedad-solo-vuelo.mjs
      # imp-8: UN SOLO ORÁCULO DE TIRO -- ningún fichero de
      # src/sim/balistica puede montarse su propia condición de parada de
      # vuelo por fuera de resolverDisparo.
      - run: node scripts/comprobar-un-solo-oraculo-tiro.mjs
      # esp-7: render-3.e2e.ts (el presupuesto p95<=50ms con GPU real) debe
      # seguir intacto, con su skip de CI, aunque aquí no se ejecute.
      - run: node scripts/comprobar-render-3.mjs
      # pre-1: ningún emisor de partículas nace fuera del registro de
      # efectos visuales -- cimiento del presupuesto de render antes de
      # añadir un solo efecto nuevo.
      - run: node scripts/comprobar-presupuesto-render.mjs
      # arm-1: el catálogo de armas sigue siendo datos -- ninguna rama por
      # identificador de arma dentro de resolver.ts.
      - run: node scripts/comprobar-sin-ramas-por-arma.mjs
      # vex-2: perturbación errática, cuenta de mecha y adherencia viven UNA
      # sola vez en src/sim/fisica/comportamientoExtendido.ts -- el cliente
      # las consume, nunca las reimplementa.
      - run: node scripts/comprobar-vuelo-unica-definicion.mjs
      # cie-3: ningún activo binario ni URL externa de activos en src/ o
      # public/ -- ver ACTIVOS.md.
      - run: npm run verificar:activos

  # #242: el e2e (10-27 min) corría dos veces por bloque, en el PR y otra
  # vez en el push del merge a dev. En el push se salta solo si el árbol del
  # commit de merge es idéntico al de la cabeza del PR y esa cabeza ya pasó
  # el e2e en verde: es exactamente el mismo código ya probado. Si dev se
  # movió entretanto, o cualquier consulta falla, el e2e corre completo.
  decidir-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      ejecutar: ${{ steps.decision.outputs.ejecutar }}
    steps:
      - id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          ejecutar=true
          motivo="evento $EVENTO"
          if [ "$EVENTO" = push ]; then
            cabeza=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
              --jq "[.[] | select(.merge_commit_sha == \"$SHA\")][0].head.sha // empty" || true)
            if [ -z "$cabeza" ]; then
              motivo="sin PR fusionado en este commit"
            else
              arbol_merge=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SHA" --jq .tree.sha || true)
              arbol_pr=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$cabeza" --jq .tree.sha || true)
              e2e_pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$cabeza/check-runs?check_name=e2e" \
                --jq '[.check_runs[] | select(.conclusion == "success")] | length' || true)
              lint_pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$cabeza/check-runs?check_name=lint-typecheck-build" \
                --jq '[.check_runs[] | select(.conclusion == "success")] | length' || true)
              if [ -z "$arbol_merge" ] || [ "$arbol_merge" != "$arbol_pr" ]; then
                motivo="el árbol del merge no es el de la cabeza del PR ($cabeza)"
              elif [ "${e2e_pr:-0}" -lt 1 ]; then
                motivo="la cabeza del PR ($cabeza) no tiene un e2e en verde"
              elif [ "${lint_pr:-0}" -lt 1 ]; then
                motivo="la cabeza del PR ($cabeza) no tiene lint-typecheck-build en verde"
              else
                ejecutar=false
                motivo="mismo árbol que la cabeza del PR ($cabeza), con lint y e2e en verde"
              fi
            fi
          fi
          echo "ejecutar=$ejecutar: $motivo" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ejecutar=$ejecutar" >> "$GITHUB_OUTPUT"

  # e2e repartido en 4 shards (desglose del run 3ed0, 2026-10-02): 102 tests
  # en 2 workers tardaban 13-22 min y crecían con cada bloque, casi la mitad
  # de lo que tarda un bloque. Más workers en el mismo runner no: los tests
  # de canvas compiten por CPU (timeouts del run 756c). El repo es público,
  # así que los minutos extra de Actions no cuestan nada.
  e2e-shard:
    runs-on: ubuntu-latest
    needs: [lint-typecheck-build, decidir-e2e]
    if: needs.decidir-e2e.outputs.ejecutar == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Un pico de apt al instalar el navegador llegó a costar 7,7 min de
      # un solo job (hud-canales); con 4 shards se pagaría cuatro veces.
      - id: version-playwright
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.version-playwright.outputs.v }}
      - if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # Con el navegador ya en caché faltan igualmente las librerías del
      # sistema, que no viven en ~/.cache.
      - if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Build como paso propio, separado del arranque que hace
      # playwright.config.ts (antes "npm run build && npm run start" en el
      # mismo comando de webServer): recién hecho un npm ci, el proceso de
      # "next start" arrancado inmediatamente a continuación de "next build"
      # en el mismo shell fallaba de forma intermitente con "Cannot find
      # module '@next/env'" pese a que el fichero existe en disco -- una
      # frontera de proceso/paso de CI entre build y start lo evita.
      - run: npm run build
      # Contra un servidor de producción local (npm run start), no contra
      # una URL de preview de Vercel: el proyecto de Vercel se crea en la
      # etapa de traspaso, después de que Gatekeeper apruebe -- ver
      # playwright.config.ts y las desviaciones del entregable de este
      # bloque.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: resultado-e2e.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-resultado-${{ matrix.shard }}
          path: resultado-e2e.json
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # Un único check-run «e2e», como antes de repartirlo: decidir-e2e (#86)
  # busca ese nombre en la cabeza del PR y el runner del pipeline lo juzga
  # igual. Además comprueba que los shards juntos han ejecutado la suite
  # entera: un shard que no recibe tests pasa en verde sin probar nada.
  e2e:
    runs-on: ubuntu-latest
    needs: [decidir-e2e, e2e-shard]
    if: always() && needs.decidir-e2e.outputs.ejecutar == 'true'
    steps:
      - name: todos los shards en verde
        env:
          RESULTADO: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-shard: $RESULTADO"
          [ "$RESULTADO" = success ]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: e2e-resultado-*
          path: resultados
      - name: los shards suman la suite entera
        # Con BASE_URL puesto playwright.config.ts no declara webServer: para
        # listar los tests no hace falta levantar (ni compilar) el juego.
        env:
          BASE_URL: http://127.0.0.1:9
        run: |
          esperado=$(npx playwright test --list --reporter=json | node -e '
            const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const contar = (s) => (s.specs || []).reduce((n, sp) => n + sp.tests.length, 0) + (s.suites || []).reduce((n, x) => n + contar(x), 0);
            console.log(r.suites.reduce((n, s) => n + contar(s), 0));')
          ejecutados=$(node -e '
            const fs = require("fs"), path = require("path");
            let n = 0;
            for (const d of fs.readdirSync("resultados")) {
              const s = JSON.parse(fs.readFileSync(path.join("resultados", d, "resultado-e2e.json"), "utf8")).stats;
              n += s.expected + s.unexpected + s.flaky + s.skipped;
            }
            console.log(n);')
          echo "tests en la suite: $esperado, ejecutados entre los shards: $ejecutados" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$esperado" -gt 0 ] && [ "$esperado" = "$ejecutados" ]
